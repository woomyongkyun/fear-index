name: 지수 갱신과 배포

on:
  schedule:
    - cron: "0 23 * * 0-4"   # 평일 08:00 KST
    - cron: "0 3 * * 1-5"    # 평일 12:00 KST
    - cron: "0 8 * * 1-5"    # 평일 17:00 KST
  push:
    branches: [main]
    paths-ignore: ["data/**"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest -q
      - name: 수집 · 계산 · 사이트 생성
        env:
          ECOS_API_KEY: ${{ secrets.ECOS_API_KEY }}
          PYTHONIOENCODING: utf-8
        run: python run.py all
      - name: 자료 저장
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "자료 갱신 $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M')"
          git push
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deploy
        uses: actions/deploy-pages@v4
